name: 10-Docker Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*

env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Cache NPM Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json') }}

      - name: Unit Testing
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ github.run_id }}
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cache NPM Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package.json') }}

      - run: npm install

      - name: Run Coverage (continue even if fails)
        run: npm run coverage
        continue-on-error: true

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result-${{ github.run_id }}
          path: coverage
          retention-days: 5

  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: DockerHub Login
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker build for testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false  # ✅ will not push the image
          tags: ${{ vars.DOCKERHUB_ACCOUNT }}/solar-system:${{ github.sha }}

      - name: Docker image testing
        run: |
          echo "Checking Docker images..."
          docker images

          echo "Running container..."
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=${{ env.MONGO_URI }} \
            -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            ${{ vars.DOCKERHUB_ACCOUNT }}/solar-system:${{ github.sha }}

          echo "Waiting for container to be ready..."
          sleep 10

          echo "Testing endpoint:"
          wget -q -O - http://localhost:3000/live | grep live

      - name: Docker build for testing
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true  # ✅ will  push the image to docker hub
          tags: ${{ vars.DOCKERHUB_ACCOUNT }}/solar-system:${{ github.sha }}
